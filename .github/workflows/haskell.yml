name: Haskell CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store
      uses: actions/cache@v6
      with:
        path: /nix
        key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-keys: nix-${{ runner.os }}-

    - name: Build & Test
      run: nix develop --command cabal test --test-show-details=streaming

    - name: Build mqtt-watch
      run: |
        mkdir -p bin/
        nix develop --command cabal install exe:mqtt-watch --installdir=bin --install-method=copy --overwrite-policy=always
        cp bin/mqtt-watch .

    - name: Store Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mqtt-watch-ubuntu-latest
        path: mqtt-watch

    - name: Build Docs
      run: |
        nix develop --command cabal haddock
        mkdir -p dist/ && cp -r $(dirname $(find dist-newstyle -path '*/doc/html/*/index.html' | head -1))/* dist/

    - name: Publish Docs
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: dist
        enable_jekyll: false
